<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator Vault</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #1a1a2e;
      margin: 0;
      color: #fff;
    }
    /* Calculator Box */
    .calculator {
      background: #16213e;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      width: 280px;
    }
    #display {
      width: 100%;
      height: 55px;
      font-size: 26px;
      text-align: right;
      padding: 10px;
      box-sizing: border-box;
      margin-bottom: 15px;
      border: none;
      border-radius: 8px;
      background-color: #0f3460;
      color: #00fff5;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      height: 50px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background-color: #0f3460;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background-color: #1f4287; }
    .operator { background-color: #e94560; }
    .operator:hover { background-color: #c0354c; }
    .clear { background-color: #ff2e63; }

    /* Secret Hidden Vault Area */
    .vault {
      display: none; /* Secret Lock Open aagum varai idhu hidden-a irukkum */
      background: #16213e;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      width: 300px;
    }
    .vault h2 { color: #00fff5; margin-top: 0; }
    .vault-box {
      background: #0f3460;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 14px;
    }
    .lock-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #e94560;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- NORMAL CALCULATOR UI -->
  <div class="calculator" id="calcScreen">
    <input type="text" id="display" readonly placeholder="0">

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button class="operator" onclick="appendValue('/')">/</button>
      <button class="operator" onclick="appendValue('*')">*</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('-')">-</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="operator" onclick="checkLock()">=</button>

      <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
      <button onclick="appendValue('.')">.</button>
    </div>
  </div>

  <!-- SECRET VAULT UI (Unlocked Page) -->
  <div class="vault" id="vaultScreen">
    <h2>🔓 Secret Vault Unlocked!</h2>
    <p>Welcome to your private space.</p>

    <div class="vault-box">
      <p><b>Your Secret Notes / Data:</b></p>
      <p>🔒 Here you can hide photos, passwords, or personal documents in future!</p>
    </div>

    <button class="lock-btn" onclick="lockVault()">Lock Vault</button>
  </div>

  <script>
    const display = document.getElementById('display');
    const calcScreen = document.getElementById('calcScreen');
    const vaultScreen = document.getElementById('vaultScreen');

    // SECRET PASSCODE SETTING
    const SECRET_PIN = "1234"; 

    function appendValue(val) {
      display.value += val;
    }

    function clearDisplay() {
      display.value = '';
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    // LOCK & CALCULATE LOGIC
    function checkLock() {
      // Step 1: Secret PIN type panni '=' press panna vault open aagum
      if (display.value === SECRET_PIN) {
        calcScreen.style.display = 'none';   // Hide Calculator
        vaultScreen.style.display = 'block'; // Show Secret Vault
        clearDisplay();
      } else {
        // Normal Calculation perform aagum
        try {
          display.value = eval(display.value);
        } catch (error) {
          display.value = 'Error';
        }
      }
    }

    // Vault-a thirumba Lock panna
    function lockVault() {
      vaultScreen.style.display = 'none'; // Hide Vault
      calcScreen.style.display = 'block'; // Show Calculator
    }
  </script>

</body>
</html>
